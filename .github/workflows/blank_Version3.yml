name: Export LineageOS 20 Minimal Recovery Source

on:
  workflow_dispatch:
    inputs:
      DEVICE_CODENAME:
        description: "Device codename (e.g. sunfish, raven, payton)"
        required: true
        default: "sunfish"
      VENDOR:
        description: "Device vendor (e.g. google, motorola, xiaomi)"
        required: true
        default: "google"
      DT_URL:
        description: "Device tree Git URL"
        required: true
        default: "https://github.com/LineageOS/android_device_google_sunfish"
      DT_BRANCH:
        description: "Device tree branch"
        required: true
        default: "lineage-20.0"
      ARCHIVE_LEVEL:
        description: "Zstd Compression Level (1-19, 15 chosen)"
        required: true
        default: "15"

jobs:
  export-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "Clearing unused tools to free ~30GB disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift \
                      /usr/local/share/boost /opt/ghc /usr/local/graalvm /var/lib/docker \
                      /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          sudo rm -rf /swapfile || true
          df -h

      - name: Install Build Tools & Compression Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl python3 python-is-python3 zstd xz-utils rsync

      - name: Setup Repo Tool
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init LineageOS 20 Source (Shallow + Blobless)
        run: |
          mkdir -p "$HOME/lineage"
          cd "$HOME/lineage"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 \
            --depth=1 --git-lfs --clone-filter=blob:none

      - name: Safely Generate Minimal Manifest (Dynamic Project Removal)
        run: |
          mkdir -p "$HOME/lineage/.repo/local_manifests"
          
          REMOVALS=(
            "LineageOS/android_external_chromium-webview"
            "LineageOS/android_packages_apps_Aperture"
            "LineageOS/android_packages_apps_Browser2"
            "LineageOS/android_packages_apps_Calendar"
            "LineageOS/android_packages_apps_CalendarProvider"
            "LineageOS/android_packages_apps_Contacts"
            "LineageOS/android_packages_apps_DeskClock"
            "LineageOS/android_packages_apps_Dialer"
            "LineageOS/android_packages_apps_Eleven"
            "LineageOS/android_packages_apps_Email"
            "LineageOS/android_packages_apps_Gallery2"
            "LineageOS/android_packages_apps_Jelly"
            "LineageOS/android_packages_apps_Launcher3"
            "LineageOS/android_packages_apps_Messaging"
            "LineageOS/android_packages_apps_Recorder"
            "LineageOS/android_packages_apps_Settings"
            "LineageOS/android_packages_apps_Trebuchet"
            "LineageOS/android_packages_apps_Updater"
            "LineageOS/android_packages_apps_Glimpse"
            "LineageOS/android_packages_inputmethods_LatinIME"
            "LineageOS/android_packages_providers_BookmarkProvider"
            "LineageOS/android_packages_providers_CalendarProvider"
            "LineageOS/android_packages_providers_ContactsProvider"
            "LineageOS/android_packages_providers_MediaProvider"
            "LineageOS/android_packages_services_Telephony"
            "LineageOS/android_cts"
            "LineageOS/android_pdk"
            "LineageOS/android_platform_testing"
          )

          MANIFEST_FILE="$HOME/lineage/.repo/local_manifests/recovery_only.xml"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$MANIFEST_FILE"
          echo '<manifest>' >> "$MANIFEST_FILE"

          for proj in "${REMOVALS[@]}"; do
            if grep -q "name=\"$proj\"" "$HOME/lineage/.repo/manifest.xml" "$HOME/lineage/.repo/manifests/"*.xml 2>/dev/null; then
              echo "  <remove-project name=\"$proj\" />" >> "$MANIFEST_FILE"
              echo "Removing existing project: $proj"
            fi
          done

          echo '</manifest>' >> "$MANIFEST_FILE"
          cat "$MANIFEST_FILE"

      - name: Sync Minimal Source Repositories
        run: |
          cd "$HOME/lineage"
          repo sync -c --no-clone-bundle --no-tags --prune --force-sync -j$(nproc --all)
          df -h

      - name: Clone Device Tree (With Smart Branch Fallback)
        run: |
          cd "$HOME/lineage"
          mkdir -p "device/${{ inputs.VENDOR }}"
          TARGET_DIR="device/${{ inputs.VENDOR }}/${{ inputs.DEVICE_CODENAME }}"
          
          echo "Cloning device tree from ${{ inputs.DT_URL }}..."
          
          if ! git clone --depth=1 -b "${{ inputs.DT_BRANCH }}" "${{ inputs.DT_URL }}" "$TARGET_DIR"; then
            echo "⚠️ Branch '${{ inputs.DT_BRANCH }}' not found! Cloning default branch..."
            git clone --depth=1 "${{ inputs.DT_URL }}" "$TARGET_DIR"
          fi

      - name: Delete .repo Directory (Save ~15GB Space)
        run: |
          echo "Removing .repo folder before archiving..."
          rm -rf "$HOME/lineage/.repo"
          df -h

      - name: Compress Source to Ultra-Small .tar.zst Archive
        run: |
          ARCHIVE_NAME="lineage20-recovery-source-${{ inputs.DEVICE_CODENAME }}.tar.zst"
          ARCHIVE_PATH="$GITHUB_WORKSPACE/$ARCHIVE_NAME"
          LEVEL="${{ inputs.ARCHIVE_LEVEL }}"

          echo "Creating compressed archive..."
          tar --use-compress-program="zstd -${LEVEL} -T0" \
              -cf "$ARCHIVE_PATH" -C "$HOME" lineage

          cd "$GITHUB_WORKSPACE"
          ls -lh "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Source Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage20-recovery-source-${{ inputs.DEVICE_CODENAME }}
          path: |
            ${{ github.workspace }}/lineage20-recovery-source-${{ inputs.DEVICE_CODENAME }}.tar.zst
            ${{ github.workspace }}/lineage20-recovery-source-${{ inputs.DEVICE_CODENAME }}.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7
